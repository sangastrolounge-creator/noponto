name: App Android
# Gera o pacote do app Android (Trusted Web Activity) para o Google Play.
#
# Chave de envio (upload key): quem guarda é o dono do app, nunca o código.
#   1. Em Settings -> Secrets and variables -> Actions, crie ANDROID_KEY_SENHA (uma senha forte).
#   2. Rode este workflow: sem ANDROID_KEYSTORE_B64, ele cria a chave e deixa por 1 dia o arquivo
#      "chave-envio" para baixar. Copie o texto de upload-keystore.b64.txt para o segredo
#      ANDROID_KEYSTORE_B64 e guarde o arquivo num lugar seguro.
#   3. Das próximas vezes ele usa a chave guardada. O resumo do job mostra a impressão digital SHA-256.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Número da versão para o Google Play (cresce a cada envio)"
        required: false
      nome:
        description: "Nome da versão (ex.: 1.0)"
        required: false
        default: "1.0"
  push:
    branches: [visual]
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      DW_KEY_SENHA: ${{ secrets.ANDROID_KEY_SENHA }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Chave de envio
        id: chave
        run: |
          mkdir -p "$RUNNER_TEMP/chave"
          K="$RUNNER_TEMP/chave/upload.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$DW_KEY_SENHA" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$K"
            echo "modo=guardada" >> "$GITHUB_OUTPUT"
          elif [ -n "$DW_KEY_SENHA" ]; then
            keytool -genkeypair -v -keystore "$K" -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$DW_KEY_SENHA" -keypass "$DW_KEY_SENHA" \
              -dname "CN=Data Worke Brasil, O=SAN GASTRO LOUNGE LTDA, L=Santa Ines, ST=MA, C=BR"
            base64 -w0 "$K" > "$RUNNER_TEMP/chave/upload-keystore.b64.txt"
            echo "modo=nova" >> "$GITHUB_OUTPUT"
          else
            echo "modo=sem" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem ANDROID_KEY_SENHA: gero só um APK de teste (assinatura de depuração), que não vai para o Google Play."
            exit 0
          fi
          echo "DW_KEYSTORE=$K" >> "$GITHUB_ENV"
          DIG=$(keytool -list -v -keystore "$K" -alias upload -storepass "$DW_KEY_SENHA" | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "### Chave de envio ($(cat "$GITHUB_OUTPUT" | grep modo= | tail -1 | cut -d= -f2))" >> "$GITHUB_STEP_SUMMARY"
          echo "Impressão digital SHA-256: \`$DIG\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Gerar o pacote
        working-directory: android
        run: |
          V="${{ github.event.inputs.versao }}"; [ -z "$V" ] && V="${{ github.run_number }}"
          N="${{ github.event.inputs.nome }}"; [ -z "$N" ] && N="1.0"
          if [ "${{ steps.chave.outputs.modo }}" = "sem" ]; then
            gradle --no-daemon :app:assembleDebug -PdwVersao="$V" -PdwNome="$N"
          else
            gradle --no-daemon :app:bundleRelease :app:assembleRelease -PdwVersao="$V" -PdwNome="$N"
          fi
          echo "### Versão $N ($V)" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs -name "*.aab" -o -name "*.apk" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: data-worke-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - if: steps.chave.outputs.modo == 'nova'
        uses: actions/upload-artifact@v4
        with:
          name: chave-envio
          path: ${{ runner.temp }}/chave/upload-keystore.b64.txt
          retention-days: 1
