name: Testes
on:
  push:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx
      - name: Rodar os testes (cada arquivo sozinho)
        run: |
          falhou=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python "$t"; then echo "OK $t"; else echo "FALHOU $t"; falhou=1; echo "$t" >> falhas.txt; fi
            echo "::endgroup::"
          done
          if [ -f falhas.txt ]; then echo "Falharam:"; cat falhas.txt; fi
          exit $falhou
