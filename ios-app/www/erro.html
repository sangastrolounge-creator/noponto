<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sem conexão</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,system-ui,sans-serif;
       background:linear-gradient(135deg,#5b7cfa,#7c6cf5);color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .c{max-width:340px}
  h1{font-size:1.4rem;margin:0 0 10px}
  p{opacity:.9;line-height:1.5;margin:0 0 22px}
  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 26px;background:#fff;color:#3d55db}
  .s{font-size:.85rem;opacity:.75;margin-top:18px}
</style>
</head>
<body>
<div class="c">
  <div style="font-size:3rem">📶</div>
  <h1>Sem conexão com a internet</h1>
  <p>O Data Worke precisa de internet para registrar o ponto com segurança. Confira o Wi-Fi ou os dados móveis.</p>
  <button onclick="location.href='https://dataworke.com.br/entrar'">Tentar de novo</button>
  <p class="s">Tentamos de novo sozinhos quando a conexão voltar.</p>
</div>
<script>window.addEventListener("online",function(){location.href="https://dataworke.com.br/entrar";});</script>
</body>
</html>
