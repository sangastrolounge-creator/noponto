{# Logo com o nome (Data Worke): versão para tela clara e para tela escura; o CSS mostra a certa. #}
{% macro logo_nome(classe='') -%}
{%- set mp = marca_atual() -%}
{%- if mp -%}
<span class="logo-nome logo-parceiro {{ classe }}">{% if mp.logo %}<img src="/marca-logo/{{ mp.logo }}" alt="{{ mp.nome }}">{% else %}<strong>{{ mp.nome }}</strong>{% endif %}</span>
{%- else -%}
<span class="logo-nome {{ classe }}"><img class="ln-claro" src="/static/logo-nome.png?v=2" alt="{{ app_nome }}" width="900" height="176"><img class="ln-escuro" src="/static/logo-nome-escuro.png?v=2" alt="{{ app_nome }}" width="900" height="176"></span>
{%- endif -%}
{%- endmacro %}
