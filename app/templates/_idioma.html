{# Seletor de idioma: PT · EN · ES, com o botão discreto de tema claro/escuro ao lado.
   Fica no topo de todas as páginas. #}
{% macro seletor(classe='') -%}
<div class="idiomas-e-tema {{ classe }}">
<button type="button" class="tema-botao" onclick="trocarTema()" title="{{ _('Tema claro ou escuro') }}" aria-label="{{ _('Tema claro ou escuro') }}">
  <svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<nav class="idiomas" aria-label="{{ _('Idioma · Language · Idioma') }}">
  {%- for cod, d in IDIOMAS.items() -%}
  <a href="/idioma/{{ cod }}?volta={{ caminho_atual()|urlencode }}" lang="{{ d[2] }}" hreflang="{{ d[2] }}" title="{{ d[0] }}" class="{{ 'ativa' if cod == idioma() }}"{% if cod == idioma() %} aria-current="true"{% endif %}>{{ d[1] }}</a>
  {%- endfor -%}
</nav>
</div>
{%- endmacro %}
